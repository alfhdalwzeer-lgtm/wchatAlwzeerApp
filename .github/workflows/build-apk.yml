name: Build Android APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # 3. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. التحقق من Flutter
      - name: Flutter doctor
        run: flutter doctor -v

      # 5. تنظيف ملفات البناء القديمة
      - name: Flutter clean
        run: flutter clean

      # 6. تحميل الحزم
      - name: Get dependencies
        run: flutter pub get

      # 7. تحليل المشروع
      - name: Analyze
        run: flutter analyze

      # 8. بناء APK Release
      - name: Build APK
        run: flutter build apk --release

      # 9. رفع APK كملف Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Al-Wazir-Chat-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

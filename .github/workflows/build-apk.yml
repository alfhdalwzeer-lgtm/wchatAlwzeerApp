name: Build Al-Wazir Chat APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # تحميل المشروع
      - name: Checkout code
        uses: actions/checkout@v4

      # إعداد Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      # إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # تحميل مكتبات المشروع
      - name: Get dependencies
        run: flutter pub get

      # فحص المشروع
      - name: Analyze Flutter project
        run: flutter analyze

      # بناء APK Release
      - name: Build Release APK
        run: flutter build apk --release

      # التأكد من وجود APK
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # رفع APK إلى GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Wazir-Chat-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
